<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Outer Glow -->
    <radialGradient id="glowGrad" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0" />
    </radialGradient>

    <!-- Shield Outer Gradient -->
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>

    <!-- Shield Fill Gradient -->
    <linearGradient id="shieldBody" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#0369A1" />
      <stop offset="40%" stop-color="#075985" />
      <stop offset="100%" stop-color="#0C4A6E" />
    </linearGradient>

    <!-- Shield Inner Bevel Gradient -->
    <linearGradient id="innerBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.05" />
    </linearGradient>

    <!-- Checkmark & Safe Badge Gradient -->
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>

    <!-- Emerald Safe Dot Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0284C7" flood-opacity="0.4" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Base Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="508" height="508" rx="110" stroke="#1E293B" stroke-width="4" stroke-opacity="0.6" />
  
  <!-- Subtle Background Glow -->
  <circle cx="256" cy="230" r="200" fill="url(#glowGrad)" />

  <!-- Shield Base with Drop Shadow -->
  <g filter="url(#dropShadow)">
    <!-- Outer Shield Rim -->
    <path d="M256 68 L104 126 C104 266 174 388 256 424 C338 388 408 266 408 126 L256 68 Z" 
          fill="url(#shieldBorder)" />

    <!-- Inner Shield Body -->
    <path d="M256 82 L118 135 C118 259 181 368 256 402 C331 368 394 259 394 135 L256 82 Z" 
          fill="url(#shieldBody)" />

    <!-- Shield Left Highlight / 3D Specular -->
    <path d="M256 82 L118 135 C118 259 181 368 256 402 L256 82 Z" 
          fill="url(#innerBevel)" />

    <!-- Glossy Top Arc -->
    <path d="M124 140 C170 180 230 200 300 190 C340 184 374 165 388 140 L256 90 L124 140 Z" 
          fill="#FFFFFF" fill-opacity="0.12" />

    <!-- Core Security Symbol: Glowing Protection Checkmark -->
    <path d="M200 248 L240 288 L318 200" 
          stroke="url(#checkGrad)" 
          stroke-width="36" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#glowFilter)" />
  </g>

  <!-- Emerald Active Live Protection Pill / Badge at Bottom Right -->
  <g filter="url(#dropShadow)">
    <circle cx="360" cy="360" r="46" fill="#090D16" stroke="#1E293B" stroke-width="4" />
    <circle cx="360" cy="360" r="36" fill="url(#emeraldGrad)" />
    <!-- Lock / Star Sparkle Icon inside -->
    <path d="M360 344 V356 M354 360 H366 M350 354 C350 348.5 354.5 344 360 344 C365.5 344 370 348.5 370 354 V360 H372 C374.2 360 376 361.8 376 364 V372 C376 374.2 374.2 376 372 376 H348 C345.8 376 344 374.2 344 372 V364 C344 361.8 345.8 360 348 360 H350 Z" 
          fill="#FFFFFF" />
  </g>
</svg>
